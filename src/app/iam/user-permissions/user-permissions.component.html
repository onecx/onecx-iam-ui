@if (isRemoteComponentDefined$ | async) {
  <ocx-slot [name]="slotName" [inputs]="{ userId: userId, displayName: displayName, issuer: issuer, active: true }">
    <ng-template #skeleton>
      <p-message
        id="iam_user_permissions_loading"
        severity="info"
        styleClass="m-3 w-fit"
        [text]="'ACTIONS.LOADING' | translate"
      ></p-message>
    </ng-template>
  </ocx-slot>
} @else {
  <p-message
    id="iam_user_permissions_error_message"
    severity="info"
    styleClass="m-3 w-fit"
    [text]="'DIALOG.PERMISSIONS.SLOT_NOT_DEFINED' | translate"
  ></p-message>
}
